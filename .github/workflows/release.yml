name: CI & Release

# Builds the fat JAR on every push/PR (CI gate) and, when a `v*` tag is pushed,
# publishes a GitHub Release with the JAR, a deploy tarball, and an auto-generated
# changelog (features / bug fixes only — see cliff.toml).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      pkgver:
        description: >-
          Version label for a test apk build — must be a valid Alpine version (no
          "-"; e.g. 0.0.0 or 0.7.0). Dispatch always builds the selected branch's HEAD.
        required: false
        default: "0.0.0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build fat JAR
    # Skip on manual dispatch — dispatch is for iterating the pmOS apk job only.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `projectVersion` in build.gradle.kts runs `git describe --tags`, so the
          # full history + tags MUST be present or the JAR is named "0.1.0-nogit".
          fetch-depth: 0
          submodules: false

      - name: Init libpebble3 submodule (composite build)
        # Only libpebble3 is needed to build the daemon; the gui / extension-example
        # submodules are not part of the Gradle build.
        run: git submodule update --init --depth 1 libs/libpebble3

      - name: Set up JDKs
        # jvmToolchain(25) compiles the code; the Gradle 8.14 daemon runs on JDK 21
        # (the last version listed becomes JAVA_HOME). 25 is exposed to Gradle's
        # toolchain resolver via the JAVA_HOME_25_X64 env var below.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shadowJar
        run: >-
          ./gradlew --no-daemon shadowJar
          "-Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64"

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp build/libs/stoandl-*-all.jar dist/

      - uses: actions/upload-artifact@v4
        with:
          name: stoandl-jar
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release + upload assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # git-cliff needs history + tags for the changelog range

      - uses: actions/download-artifact@v4
        with:
          name: stoandl-jar
          path: dist

      - name: Build deploy tarball
        run: |
          v="${GITHUB_REF_NAME#v}"
          stage="stoandl-$v"
          mkdir -p "$stage"
          cp dist/stoandl-*-all.jar "$stage/stoandl.jar"
          for f in install.sh packaging/stoandl.service packaging/stoandl.conf.example; do
            [ -f "$f" ] && cp "$f" "$stage/"
          done
          tar czf "dist/stoandl-$v.tar.gz" "$stage"

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          # Fall back to a one-line body if a tag has only skipped commits (docs/chore).
          body: ${{ steps.cliff.outputs.content || format('Release {0}', github.ref_name) }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/stoandl-*-all.jar
            dist/stoandl-*.tar.gz

  apk:
    name: Build pmOS package
    needs: release
    # A tag runs this after the release job; a manual dispatch builds the selected
    # branch's HEAD so the packaging can be iterated without cutting a tag.
    # !cancelled() lets it run even though `release` is skipped on dispatch.
    if: >-
      !cancelled() &&
      (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # attach the .apk(s) to the release (tag runs only)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # the APKBUILD fetches libpebble3 by commit from GitHub

      - name: Point APKBUILD at this build
        # The APKBUILD builds from source fetched by commit from GitHub, so pin
        # pkgver + both commit SHAs to exactly what's being built. The stoandl commit
        # and the recorded libpebble3 submodule commit must already be pushed to their
        # repos for the archive downloads to resolve.
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            v="${{ inputs.pkgver }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          commit="$(git rev-parse HEAD)"
          lp3="$(git ls-tree HEAD libs/libpebble3 | awk '{print $3}')"
          sed -i \
            -e "s/^pkgver=.*/pkgver=$v/" \
            -e "s/^_commit=.*/_commit=$commit/" \
            -e "s/^_libpebble3_commit=.*/_libpebble3_commit=$lp3/" \
            packaging/APKBUILD
          echo "Building pkgver=$v  stoandl=$commit  libpebble3=$lp3"

      # A pure-Java noarch package — no cross-arch/QEMU, build on native x86_64.
      # edge is required for openjdk 25; the Gradle build needs network, which
      # `abuild -r` (unlike rootbld) allows.
      - uses: jirutka/setup-alpine@v1
        with:
          branch: edge
          extra-repositories: |
            https://dl-cdn.alpinelinux.org/alpine/edge/community
          packages: >
            alpine-sdk
            doas
            openjdk21-jdk
            openjdk25-jdk

      - name: Set up the package signing key
        # With a persistent key configured (ABUILD_PRIVKEY secret + a committed public
        # key under packaging/keys/), sign with it so anyone who trusts that public key
        # once can `apk add` every release without --allow-untrusted. Otherwise fall
        # back to a throwaway key (installs then need --allow-untrusted).
        env:
          ABUILD_PRIVKEY: ${{ secrets.ABUILD_PRIVKEY }}
        run: |
          set -eu
          mkdir -p "$HOME/.abuild"
          pub="$(ls packaging/keys/*.rsa.pub 2>/dev/null | head -1 || true)"
          if [ -n "$ABUILD_PRIVKEY" ] && [ -n "$pub" ]; then
            key="$(basename "${pub%.pub}")"
            priv="$HOME/.abuild/$key"
            printf '%s\n' "$ABUILD_PRIVKEY" > "$priv"
            chmod 600 "$priv"
            cp "$pub" "$priv.pub"

            # Validate the secret here. abuild-sign runs `openssl dgst -sign` deep in
            # the build; a bad key there dies with an opaque OpenSSL decode stack
            # ("Could not find private key … Input structure: EncryptedPrivateKeyInfo").
            # Fail at this step with an actionable message instead. </dev/null so an
            # encrypted key errors out rather than blocking on a passphrase prompt.
            if ! openssl pkey -in "$priv" -noout </dev/null 2>/tmp/keyerr; then
              echo "::error::ABUILD_PRIVKEY is not a loadable, unencrypted PEM private key."
              echo "The secret must be the *verbatim* private key that matches $key.pub:"
              echo "  - full PEM incl. the -----BEGIN/END … PRIVATE KEY----- lines and every newline"
              echo "  - no passphrase (abuild-keygen keys are never encrypted)"
              echo "  - no extra base64/hex wrapping, no leading indent, not collapsed to one line"
              echo "  Set it straight from the key file to avoid paste corruption:"
              echo "    gh secret set ABUILD_PRIVKEY < ~/.abuild/$key"
              sed 's/^/  openssl: /' /tmp/keyerr || true
              exit 1
            fi

            # It must be the private half of the COMMITTED public key, else we would
            # sign every release with a key nobody trusts (installs would silently need
            # --allow-untrusted). Compare canonical SPKI serialisations of both.
            openssl pkey -in "$priv" -pubout 2>/dev/null > /tmp/derived.pub
            openssl pkey -pubin -in "$priv.pub" -pubout 2>/dev/null > /tmp/committed.pub
            if ! cmp -s /tmp/derived.pub /tmp/committed.pub; then
              echo "::error::ABUILD_PRIVKEY does not match the committed public key $key.pub."
              echo "Point the secret at that key's private half, or commit the .pub that"
              echo "pairs with this secret (the key id in the filename must match too)."
              exit 1
            fi

            echo "PACKAGER_PRIVKEY=$priv" > "$HOME/.abuild/abuild.conf"
            doas cp "$pub" /etc/apk/keys/
            echo "Signing with the committed release key: $key"
          else
            abuild-keygen -a -i -n
            echo "No ABUILD_PRIVKEY/pubkey configured — throwaway key (apk needs --allow-untrusted)"
          fi
        shell: alpine.sh {0}

      - name: Build the .apk
        # abuild installs the makedepends via abuild-apk (abuild-group members only);
        # add the user to the group and re-login with `doas su`. Pin REPODEST so the
        # Stage step finds the apks regardless of the su session's $HOME. Run
        # `abuild checksum` first: the source tarballs are commit-pinned, so their
        # sha512sums change every time _commit / _libpebble3_commit are rewritten.
        run: |
          doas adduser "$(id -un)" abuild
          mkdir -p "$GITHUB_WORKSPACE/packages"
          pkgdir="$(pwd)/packaging"
          # GitHub's runner image ships the Android SDK and exports ANDROID_HOME, which
          # leaks into the chroot — libpebble3 then tries to configure its Android target
          # against an SDK that isn't in Alpine. Unset it so it's a Linux-only JVM build.
          doas su "$(id -un)" -c "unset ANDROID_HOME ANDROID_SDK_ROOT; cd '$pkgdir' && export REPODEST='$GITHUB_WORKSPACE/packages' && abuild checksum && abuild -r"
        shell: alpine.sh {0}

      - name: Stage the .apk(s)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find "$GITHUB_WORKSPACE/packages" -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
        shell: alpine.sh {0}

      - uses: actions/upload-artifact@v4
        with:
          name: stoandl-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach .apk(s) + signing key to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          # Publish the public signing key so users can trust it once, then apk add
          # without --allow-untrusted.
          for pub in packaging/keys/*.rsa.pub; do
            [ -f "$pub" ] && gh release upload "$GITHUB_REF_NAME" "$pub" --clobber
          done
        env:
          GH_TOKEN: ${{ github.token }}
